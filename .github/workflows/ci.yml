name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # 教材は DB にある。取り込みが通らなくなったら、
      # 管理画面から直せる土台そのものが壊れている
      - name: Seed the catalog
        env:
          AI_PROVIDER: mock
        run: |
          python manage.py migrate --noinput
          python manage.py seed_catalog

      - name: Run tests
        env:
          AI_PROVIDER: mock
        run: python -m pytest -q

      - name: Lint
        run: |
          uv pip install --system ruff
          ruff check .

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  a11y:
    name: Accessibility (WCAG 2.1 A/AA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # 本番と同じビルド成果物に当てる。開発サーバーでしか見ないと、
      # ビルドしたときだけ壊れるものを取りこぼす。
      # 通信は全部 route で差し替えるので、バックエンドは要らない。
      - name: Build and serve
        run: |
          npm run build
          nohup npx vite preview --port 4319 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4319/ > /dev/null && exit 0
            sleep 1
          done
          echo "画面が起動しませんでした"; cat /tmp/preview.log; exit 1

      - name: Check every screen
        run: npm run check:a11y

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 探索テスト（e2e/exploratory.spec.ts）は本物のバックエンドに当てる。
      # AI_PROVIDER=mock のままで完走できることが憲章 原則 III の要件なので、
      # APIキーは要らない。ほかの e2e はスタブに当てるので、
      # ここで起きているのは exploratory 用の準備だけ。
      - name: Start backend
        working-directory: backend
        env:
          AI_PROVIDER: mock
          FRONTEND_URL: http://127.0.0.1:5173
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          MAX_ATTEMPTS_PER_SESSION: "10"
          # テストは全部おなじ接続元から来るので、接続元単位の上限は外す。
          # 付けたままだと、テストを増やしたときに上限へ当たって
          # 「アプリが壊れた」ように見える。
          # 上限そのものは backend/tests/test_ai_quota.py で確かめている。
          AI_RUNS_PER_IP_PER_DAY: "0"
          AI_RUNS_PER_DAY: "0"
        run: |
          python manage.py migrate --noinput
          python manage.py seed_catalog
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "バックエンドが起動しませんでした"; cat /tmp/django.log; exit 1

      # 開発サーバーではなく本番と同じビルド成果物に当てる。
      # 開発サーバーでしか見ないと、ビルドしたときだけ壊れるものを取りこぼす。
      - name: Run E2E and exploratory tests (production build)
        working-directory: frontend
        env:
          E2E_TARGET: build
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show the backend log on failure
        if: failure()
        run: cat /tmp/django.log

  # 本物のバックエンドに当てる通し確認（登録・CSRF・保持ポリシー）。
  #
  # e2e ジョブが画面の導線を確かめるのに対して、こちらは
  # Playwright を介さず curl で直接 API を叩く、公開の可否を分ける経路。
  smoke:
    name: Smoke (real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      # AI_PROVIDER=mock のままで教材を完走できることが憲章 原則 III の要件。
      # だから、ここに APIキーは要らない。
      - name: Start backend
        working-directory: backend
        env:
          AI_PROVIDER: mock
          FRONTEND_URL: http://127.0.0.1:5173
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          MAX_ATTEMPTS_PER_SESSION: "10"
          # テストは全部おなじ接続元から来るので、接続元単位の上限は外す。
          # 上限そのものは backend/tests/test_ai_quota.py で確かめている。
          AI_RUNS_PER_IP_PER_DAY: "0"
          AI_RUNS_PER_DAY: "0"
        run: |
          python manage.py migrate --noinput
          python manage.py seed_catalog
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "バックエンドが起動しませんでした"; cat /tmp/django.log; exit 1

      - name: Ready check
        run: |
          body=$(curl -sf http://127.0.0.1:8000/health/ready)
          echo "$body"
          echo "$body" | grep -q '"status": "ok"'

      # 教材が配られること。ここが空だと、画面は同梱の分に落ちたまま、
      # 管理画面の編集が届かない
      - name: The catalog is served
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/catalog/ \
            | python -c "import json,sys; c=json.load(sys.stdin)['courses']; assert c and c[0]['lessons'], '教材が空です'; print(len(c[0]['lessons']), 'lessons')"

      # 登録してログイン状態になること。第一リリースの合否そのもの
      - name: Sign up and see the session
        run: |
          jar=$(mktemp)
          curl -sf -c "$jar" http://127.0.0.1:8000/api/v1/accounts/csrf/ > /dev/null
          token=$(awk '$6=="csrftoken" {print $7}' "$jar")
          curl -sf -b "$jar" -c "$jar" -X POST \
            -H "Content-Type: application/json" -H "X-CSRFToken: $token" \
            -d '{"email":"ci@example.com","password":"aippo-strong-pass-9","accept_terms":true,"accept_privacy":true}' \
            http://127.0.0.1:8000/api/v1/accounts/signup/ > /dev/null
          curl -sf -b "$jar" http://127.0.0.1:8000/api/v1/accounts/me/ \
            | grep -q '"authenticated": *true'

      # 合言葉が無い書き込みは通らないこと。
      # 通ると、よそのサイトから本人の代わりに操作できてしまう
      - name: A write without the CSRF token is refused
        run: |
          jar=$(mktemp)
          curl -sf -c "$jar" http://127.0.0.1:8000/api/v1/accounts/csrf/ > /dev/null
          token=$(awk '$6=="csrftoken" {print $7}' "$jar")
          curl -sf -b "$jar" -c "$jar" -X POST \
            -H "Content-Type: application/json" -H "X-CSRFToken: $token" \
            -d '{"email":"csrf@example.com","password":"aippo-strong-pass-9","accept_terms":true,"accept_privacy":true}' \
            http://127.0.0.1:8000/api/v1/accounts/signup/ > /dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" -b "$jar" -X PATCH \
            -H "Content-Type: application/json" \
            -d '{"display_name":"よそから"}' \
            http://127.0.0.1:8000/api/v1/accounts/profile/)
          test "$code" = "403" || { echo "合言葉なしで書けてしまった: $code"; exit 1; }

      # 古い記録を消す仕組みが動くこと。ポリシーに書いた以上、
      # 動かなくなったら書いたことと食い違う
      - name: The retention job runs
        working-directory: backend
        env:
          AI_PROVIDER: mock
          FRONTEND_URL: http://127.0.0.1:5173
        run: python manage.py prune_data --dry-run

      - name: Show the log on failure
        if: failure()
        run: cat /tmp/django.log

  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    # compose は build のときもファイル全体を先に展開する。
    # 必須の変数が欠けているとイメージを作る前に止まるので、ジョブ全体に置く。
    env:
      DJANGO_SECRET_KEY: ci-placeholder-value-that-is-long-enough-for-checks
      POSTGRES_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      # 本番の姿で、設定の抜けを Django 自身に検査させる。
      # 抜けたまま公開されるより、ここで落ちたほうがよい。
      - name: Production settings pass Django's own checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-placeholder-value-that-is-long-enough-for-the-checks-to-pass
          DJANGO_ALLOWED_HOSTS: aippo.example.com
          FRONTEND_URL: https://aippo.example.com
          SECURE_SSL_REDIRECT: "true"
          AI_PROVIDER: mock
        run: python manage.py check --deploy --fail-level WARNING

      # 設定ミスは動かすまで気づけないので、形だけでも先に検査する
      - name: Validate docker compose
        env:
          DJANGO_SECRET_KEY: ci-placeholder-value-that-is-long-enough-for-checks
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
