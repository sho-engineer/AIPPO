name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: |
          uv pip install --system ruff
          ruff check .

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 探索テストは本物のバックエンドに当てる。
      # AI_PROVIDER=stub のままで完走できることが憲章 原則 III の要件なので、
      # APIキーは要らない。
      - name: Start backend
        working-directory: backend
        env:
          AI_PROVIDER: stub
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          MAX_ATTEMPTS_PER_SESSION: "10"
          # テストは全部おなじ接続元から来るので、接続元単位の上限は外す。
          # 付けたままだと、テストを増やしたときに上限へ当たって
          # 「アプリが壊れた」ように見える。
          # 上限そのものは backend/tests/test_ai_quota.py で確かめている。
          AI_RUNS_PER_IP_PER_DAY: "0"
          AI_RUNS_PER_DAY: "0"
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/lessons/rewrite_text_001/session/ > /dev/null && exit 0
            sleep 1
          done
          echo "バックエンドが起動しませんでした"; cat /tmp/django.log; exit 1

      # 開発サーバーではなく本番と同じビルド成果物に当てる。
      # 開発サーバーでしか見ないと、ビルドしたときだけ壊れるものを取りこぼす。
      - name: Run E2E and exploratory tests (production build)
        working-directory: frontend
        env:
          E2E_TARGET: build
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    # compose は build のときもファイル全体を先に展開する。
    # 必須の変数が欠けているとイメージを作る前に止まるので、ジョブ全体に置く。
    env:
      DJANGO_SECRET_KEY: ci-placeholder-value-that-is-long-enough-for-checks
      POSTGRES_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      # 設定ミスは動かすまで気づけないので、形だけでも先に検査する
      - name: Validate docker compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
