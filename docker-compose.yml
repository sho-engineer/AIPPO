# AIPPO をひととおり立ち上げる。
#
#   cp .env.docker.example .env
#   docker compose up --build
#
# 画面   http://localhost:5173
# 管理   http://localhost:8000/admin/
#
# AI_PROVIDER=stub のままでもレッスンは完走できる（憲章 原則 III）。
# 本物の AI を使うときだけ ANTHROPIC_API_KEY を入れる。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aippo}
      POSTGRES_USER: ${POSTGRES_USER:-aippo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aippo} -d ${POSTGRES_DB:-aippo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY を .env に設定してください}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-aippo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aippo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_ATTEMPTS_PER_SESSION: ${MAX_ATTEMPTS_PER_SESSION:-10}
      AI_RUNS_PER_IP_PER_DAY: ${AI_RUNS_PER_IP_PER_DAY:-100}
      AI_RUNS_PER_DAY: ${AI_RUNS_PER_DAY:-2000}
      # compose 内では前段にプロキシを置いていないので false のまま。
      # ロードバランサ配下に出すときだけ true にする。
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      # 本番の姿（DEBUG=false）のまま手元で確認するので、
      # HTTPS への転送は切る。実際に公開するときは true に戻すこと。
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # 空にすると、表示中のホストの 8000 番へ向く
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
