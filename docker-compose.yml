# AIPPO をひととおり立ち上げる。
#
#   cp .env.docker.example .env
#   docker compose up --build
#
# 画面   http://localhost:5173
# 管理   http://localhost:8000/admin/
#
# AI_PROVIDER=mock のままでもレッスンは完走できる（憲章 原則 III）。
# 本物の AI を使うときだけ、鍵（OPENAI_API_KEY など）を入れる。
# 鍵を入れずに openai を指定すると、黙って mock へ倒さず 503 で失敗する。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aippo}
      POSTGRES_USER: ${POSTGRES_USER:-aippo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aippo} -d ${POSTGRES_DB:-aippo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY を .env に設定してください}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-aippo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aippo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # 確認メールと再設定メールのリンクの行き先。DEBUG=false では必須
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # 開発ではコンソールへ出す（実際には送らない）。
      # 実際に送るときだけ smtp を指定し、宛先サーバーと差出人を入れる
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AIPPO <no-reply@localhost>}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gpt-5-nano}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 登録していない人の記録を残す日数。ポリシーに書いた期間と揃える
      GUEST_DATA_RETENTION_DAYS: ${GUEST_DATA_RETENTION_DAYS:-180}
      # 二重送信の抑止に使う。指定しなければ DB の表を使う
      REDIS_URL: ${REDIS_URL:-}
      # 外部サービスでのログイン。鍵を入れた先だけボタンが出る
      BACKEND_URL: ${BACKEND_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:-}
      # 空なら何も読み込まない
      SENTRY_DSN: ${SENTRY_DSN:-}
      MAX_ATTEMPTS_PER_SESSION: ${MAX_ATTEMPTS_PER_SESSION:-10}
      AI_RUNS_PER_IP_PER_DAY: ${AI_RUNS_PER_IP_PER_DAY:-100}
      AI_RUNS_PER_DAY: ${AI_RUNS_PER_DAY:-2000}
      # 画像は文章と別枠で数える（1枚が文章1回の数十倍かかるため）。
      # 0以下にすると歯止めが外れる。docs/image-lessons.md を参照。
      AI_IMAGE_RUNS_PER_IP_PER_DAY: ${AI_IMAGE_RUNS_PER_IP_PER_DAY:-20}
      AI_IMAGE_RUNS_PER_DAY: ${AI_IMAGE_RUNS_PER_DAY:-200}
      AI_IMAGE_DAILY_REQUEST_LIMIT_GUEST: ${AI_IMAGE_DAILY_REQUEST_LIMIT_GUEST:-3}
      AI_IMAGE_DAILY_REQUEST_LIMIT_USER: ${AI_IMAGE_DAILY_REQUEST_LIMIT_USER:-8}
      # compose 内では前段にプロキシを置いていないので false のまま。
      # ロードバランサ配下に出すときだけ true にする。
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      # 本番の姿（DEBUG=false）のまま手元で確認するので、
      # HTTPS への転送は切る。実際に公開するときは true に戻すこと。
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # live は何も外を見ない。DBが一瞬詰まっただけで
      # 全プロセスが再起動されるのを避ける
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # 空にすると、表示中のホストの 8000 番へ向く
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
