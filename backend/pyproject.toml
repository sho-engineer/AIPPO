[project]
name = "aippo-backend"
version = "0.1.0"
description = "AIPPO backend (Django REST Framework)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "python-dotenv>=1.0",
    "anthropic>=0.116",
    "openai>=1.60",
    # 本番運用
    "gunicorn>=22.0",
    "whitenoise[brotli]>=6.7",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# 例外の見張り。入れなくても動く（SENTRY_DSN が空なら何も読み込まない）。
monitoring = [
    "sentry-sdk>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# これはライブラリではなくアプリなので、配る中身は無い。
# `pip install -e .` は依存を入れるためだけに使う。
#
# 宣言しないと setuptools が apps / config / tests / templates を
# それぞれ別のパッケージとみなし、「どれを入れるのか分からない」と
# 言って止まる。README に書いた手順がそのままでは通らない。
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 移行ファイルは makemigrations が書く。help_text の日本語が長いだけで
# 落ちると、モデルを直すたびに手で折り返すことになる。
"*/migrations/*" = ["E501"]
