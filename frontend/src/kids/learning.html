.success{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px 16px;gap:9px;text-align:center}.successBadge{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:#e7f9f3;border:3px solid #a2e0ca;color:#288269;animation:pop .45s cubic-bezier(.2,1.8,.3,1)}.successBadge svg{width:42px;height:42px}.success h1{font-size:clamp(26px,7vw,40px);font-weight:1000;letter-spacing:-.055em;line-height:1.2;margin:0}.success p{font-size:15px;font-weight:900;max-width:320px;color:#456e8d;margin:0}.successVisual{flex:1;min-height:90px;max-height:270px;width:100%;border-radius:20px;background:linear-gradient(135deg,#edf9ff,#f8fcff);display:flex;align-items:center;justify-content:center;gap:9px}.successVisual .po{width:95px;height:95px;flex-basis:95px}.successVisual .rocket{width:105px;height:160px}.unlockNote{font-size:12px;color:#3c876e;font-weight:1000;background:#e8f8f1;padding:8px 12px;border-radius:12px}.confetti{position:absolute;top:-20px;width:8px;height:17px;border-radius:4px;z-index:10;pointer-events:none;animation:fall 1.3s forwards}

.parentView{background:linear-gradient(180deg,#ffffff,#f5faff 95%)}.parentTop{padding:17px 18px 9px;display:flex;align-items:flex-start;gap:10px}.parentTitles{flex:1;min-width:0}.parentTop .h1{font-size:clamp(19px,5.3vw,30px);line-height:1.3;overflow-wrap:anywhere}.parentIntro{padding:0 20px 10px;color:#607a94;font-weight:750;font-size:12px;line-height:1.55}.pyramidWrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:2px 16px 8px}.tier{border:0;width:var(--w);min-height:53px;max-height:75px;background:linear-gradient(110deg,#dde9f5,#ebf1f8);color:#637992;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;border-radius:9px;position:relative;transition:transform .14s,box-shadow .14s;padding:5px 8px;text-align:center}.tier:active{transform:scale(.98)}.tier.mastered{background:linear-gradient(100deg,#1268e8,#2bb0ee);color:#fff;box-shadow:0 3px 0 #a3cde9}.tier.current{background:linear-gradient(100deg,#69cbbb,#b9eade);color:#0f5d62;box-shadow:0 3px 0 #c8ecdf}.tier.selected{outline:3px solid #ffc654;outline-offset:1px;z-index:2}.tierNo{font-size:9px;font-weight:1000;letter-spacing:.1em;opacity:.87}.tierTitle{font-size:clamp(10px,2.85vw,15px);font-weight:1000;line-height:1.2;white-space:normal;overflow-wrap:anywhere}.tierNote{position:absolute;right:8px;top:8px;font-size:11px;font-weight:900}.evidence{flex:none;padding:12px 16px;margin:0 13px 11px;background:#fff;border:1.5px solid #d7e7f8;border-radius:16px;box-shadow:0 3px 16px #1049970e;display:flex;flex-direction:column;gap:5px;min-height:92px}.evidenceTitle{font-weight:1000;font-size:14px}.evidenceBody{font-size:12px;line-height:1.5;color:#50708e;font-weight:750}.evidenceStatus{font-size:11px;font-weight:950;color:#1e7b66}.parentBottom{display:flex;gap:7px;padding:0 13px 14px}.parentBottom button{flex:1;font-size:12px;min-height:45px}
/* overlays and microinteraction */

function save(){if(!progressReadReady){persistenceAvailable=false;return false}try{if(localStorage.getItem(STORE)!==progressSnapshot){progressReadReady=false;progressReadError='別の画面で記録が更新されました。上書きを止めています';persistenceAvailable=false;return false}const text=JSON.stringify(saved);localStorage.setItem(STORE,text);if(localStorage.getItem(STORE)!==text)throw Error('unverified progress');progressSnapshot=text;persistenceAvailable=true}catch{progressReadReady=false;progressReadError='記録の保存を確認できません。再読み込みで確認してください';persistenceAvailable=false}return persistenceAvailable}

const spokenPoLines=new Set();

function setupPoSpeech(root=app){
 finishPoSpeech();
 const scope=(typeof progressStore==='function'?progressStore():STORE);
 const rows=[...root.querySelectorAll('.mapStory p,.questSub,.unlockNote,.stagePreviewSpeech,.checkpointPurposeSpeech,.storySpeech,.dailyPoSpeech')].filter(el=>{
  const text=el.textContent.trim();if(!text)return false;
  const owner=el.closest('.stageStory')?.dataset.world||el.closest('.dailyModal')?.dataset.goal||quests[state.quest]?.id||state.world;
  const key=scope+':'+owner+':'+text;
  if(spokenPoLines.has(key))return false;spokenPoLines.add(key);return true;
 });
 if(typeof matchMedia!=='function'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 if(!rows.length)return;
 const entries=rows.map(el=>{const full=document.createElement('span'),visual=document.createElement('span');full.className='poSpeechFull';while(el.firstChild)full.append(el.firstChild);visual.className='poSpeechVisual';visual.setAttribute('aria-hidden','true');visual.innerHTML=full.innerHTML;el.classList.add('poSpeech');el.append(full,visual);const walker=document.createTreeWalker(visual,NodeFilter.SHOW_TEXT),nodes=[],glyphs=[];let node;while(node=walker.nextNode())nodes.push(node);for(const textNode of nodes){const fragment=document.createDocumentFragment();const parts=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(textNode.textContent)].map(part=>part.segment):Array.from(textNode.textContent);for(const text of parts){const glyph=document.createElement('span');glyph.className='poGlyph';glyph.textContent=text;fragment.append(glyph);glyphs.push(glyph)}textNode.replaceWith(fragment)}return {el,full,visual,glyphs,length:glyphs.length}});
 let shown=0;const maximum=Math.max(...entries.map(row=>row.length)),step=Math.max(1,Math.ceil(maximum/60));
 const finish=()=>finishPoSpeech();
 const timer=setInterval(()=>{const previous=shown;shown+=step;for(const entry of entries)for(let i=previous;i<Math.min(shown,entry.length);i++)entry.glyphs[i].classList.add('is-shown');if(shown>=maximum)finish()},28);
 app.addEventListener('pointerdown',finish,{capture:true});app.addEventListener('keydown',finish,{capture:true});
 speechCleanup=()=>{clearInterval(timer);app.removeEventListener('pointerdown',finish,true);app.removeEventListener('keydown',finish,true);for(const {el,full,visual} of entries){visual.remove();while(full.firstChild)el.insertBefore(full.firstChild,full);full.remove();el.classList.remove('poSpeech')}};
}

function showDaily(context=null){
 let goal=context,checked=false,childDone=false;const overlay=document.createElement('div');overlay.className='overlay';app.querySelector('.shell').append(overlay);
 const close=()=>{finishPoSpeech();overlay.remove()};
 function draw(){

  const history=saved.daily.length?`<h3>家庭で試した記録 ${saved.daily.length}件</h3>${[...saved.daily].reverse().map(r=>`<div class=dailyRecord><strong>${escape(r.title||dailyGoals.find(g=>g.id===r.goal)?.title||'おうちミッション')}</strong><p>${escape(r.at)} ・ ${{cards:'カード練習',ai:'保護者が実AI操作',none:'AI未使用'}[r.mode]||'未確認'} ・ ${{useful:'役立った',revised:'直して使った',unused:'不採用'}[r.outcome]||'未確認'}<br>${r.support==='mostly'?'考える・確かめる部分はほぼ自分で':'一緒に考えた'}<br>本人の希望：${r.childWish==='continue'?'続けたい':r.childWish==='stop'?'今日はやめたい':'未記録'}（成績ではありません）</p></div>`).join('')}`:'';
  overlay.innerHTML=`<div class="modal dailyModal" data-goal="${escape(goal?.id||'choose')}" role=dialog aria-modal=true aria-labelledby=daily-title><h2 id=daily-title>おうちミッション</h2><div class=dailyScroll><section class=dailyChild><div class=dailyPoTalk>${po(childDone?'celebrate':'talking')}<p class=dailyPoSpeech>${childText(speech)}</p></div>${!goal?`<div class=dailyChildChoices>${dailyGoals.map(g=>`<button class=secondary data-daily-goal="${g.id}">${dailyChildScripts[g.id].title}</button>`).join('')}</div>`:!checked?`<div class=dailyChildChoices><button class=secondary data-daily-check=yes>${child.check}</button><button class=secondary data-daily-check=no>${goal.id==='help'?'AIに ぜんぶ まかせる':'AIの こたえを そのまま つかう'}</button></div><p class=dailyFeedback role=status></p>`:!childDone?'<div class=dailyChildActions><button class=secondary data-daily-child-done>できた！</button><button class=secondary data-daily-later>あとで やる</button></div>':''}</section><details class=dailyParent><summary>おうちのひとへ・きろく</summary>${parentForm}${history}<p>家庭記録は自己申告です。ゲーム内の確認や日常利用能力の認定とは別です。記録しなくても冒険は進めます。</p></details></div><button class=primary data-daily-close>ぼうけんに もどる</button></div>`;

  setupPoSpeech(overlay);
 }draw();
}

のブラウザの記録は1人分で、使う人を分けられません。名前を変えても記録は同じです。</p><p class="settingsHelp">家庭の記録は最新30件、日常チャレンジと作品の履歴はそれぞれ最新50件。上限を超えると古い記録から外れます。</p><p class="settingsHelp">冒険は初回クリアと直近の再挑戦を分けて記録します。旧記録は初回のみです。</p><p class="settingsHelp">記録日は保存時の端末のタイムゾーンを使います。旧記録は従来の基準で、同じ日の順序が不明な場合があります。</p><p class="settingsHelp">書き出しはJSONの控えです。この版では読み込み・復元できません。</p><button class="settingAction" data-action="export">${ico('download')} 学習記録を書き出す ${ico('arrow',18)}</button><button class="settingAction danger" data-action="reset">${ico('trash')} 学習記録をすべて消す ${ico('arrow',18)}</button></section><section class="settingsSection"><h2>サービスについて</h2><button class="settingAction" data-action="privacy">${ico('check')} プライバシーについて ${ico('arrow',18)}</button><button class="settingAction" data-action="terms">${ico('question')} ご利用について ${ico('arrow',18)}</button><p class="settingsHelp">AIPPO Kids β版・AIの結果はシミュレーション。音声・外部AI送信・広告トラッキングなし。</p></section></div><div class="settingsFooter"><button class="secondary" data-action="settings-done">ゲームに戻る</button></div></main>`);
 app.querySelector('[data-action=settings-back]').onclick=closeSettings;
 app.querySelector('[data-action=settings-done]').onclick=closeSettings;
 const profileSave=app.querySelector('[data-action=profile-save]'),saveStatus=app.querySelector('.settingsSaveStatus');const markUnsaved=()=>{profileSave.classList.remove('isSaved');profileSave.innerHTML=ico('check')+' この設定を保存する';saveStatus.classList.remove('saved');saveStatus.textContent='まだ保存していません。下のボタンで保存してください。'};app.querySelectorAll('#child-nick,#child-age,#child-mode,#child-reading').forEach(field=>{field.addEventListener('input',markUnsaved);field.addEventListener('change',markUnsaved)});profileSave.onclick=()=>{const candidate={...settings,nickname:app.querySelector('#child-nick').value.trim().slice(0,12),ageBand:app.querySelector('#child-age').value,challengeMode:app.querySelector('#child-mode').value||null,readingSupport:app.querySelector('#child-reading').value};const ok=saveSettings(candidate);if(!ok){settingsView();app.querySelector('.settingsSaveStatus').textContent='保存を確認できません。保存前の設定を使っています。もう一度おためしください。';return}profileSave.classList.add('isSaved');profileSave.innerHTML=ico('check')+' 保存しました';saveStatus.classList.add('saved');saveStatus.textContent='この端末に保存しました。ゲームに戻ると、変えた設定であそべます。'};
 app.querySelector('[data-action=howto]').onclick=howTo;
 app.querySelector('[data-action=export]').onclick=exportProgress;
 app.querySelector('[data-action=reset]').onclick=askReset;
 app.querySelector('[data-action=privacy]').onclick=()=>policyModal('privacy');
 app.querySelector('[data-action=terms]').onclick=()=>policyModal('terms');
 app.querySelector('[data-nav=parent]').onclick=()=>go('parent');
}
function exportProgress(){
 const record={app:'AIPPO Kids',version:4,exportedAt:new Date().toISOString(),profile:{nickname:settings.nickname,ageBand:settings.ageBand,challengeMode:settings.challengeMode||null,readingSupport:settings.readingSupport||'auto'},progress:{schema:4,done:saved.done,latestAttempts:saved.latestAttempts,recordSequence:saved.recordSequence,artwork:saved.artwork,portfolio:saved.portfolio,daily:saved.daily,challenges:saved.challenges,attempts:saved.attempts,competencies:worlds.map((_,i)=>({world:i,verified:stagePassed(i)}))}};
 const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aippo-kids-progress.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function askReset(){
 const overlay=document.createElement('div');overlay.className='overlay';
 overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">本当に消しますか？</h2><p>クリア記録、作品、家庭の記録、日常チャレンジ、ニックネーム、年齢帯、学び方と保護者の確認が消えます。元には戻せません。JSONの控えからも、この版では復元できません。</p><p class="resetScope">${typeof progressStore==='function'&&progressStore()!==STORE?'消える範囲：この端末の「ログイン中のアカウント」の記録と、共通の設定。ゲストの記録は残ります。':'消える範囲：この端末の「ゲスト」の記録と、共通の設定。アカウントの記録は残ります。'}</p><button class="primary dangerPrimary" data-confirm="reset">全部消す</button><button class="secondary" data-confirm="cancel">やめる</button></div>`;
 app.querySelector('.shell').append(overlay);
 overlay.querySelector('[data-confirm=cancel]').onclick=()=>overlay.remove();
 overlay.querySelector('[data-confirm=reset]').onclick=()=>{const removed=[];for(const key of [STORE,SETTINGS_STORE]){try{localStorage.removeItem(key);if(localStorage.getItem(key)===null)removed.push(key)}catch{}}if(removed.includes(STORE)){progressSnapshot=null;progressReadReady=true;progressReadError='';persistenceAvailable=true;Object.assign(saved,{...defaults(),schema:4});state.quest=0;state.parentTier=4}if(removed.includes(SETTINGS_STORE)){settingsSnapshot=null;settingsReadReady=true;settingsReadError='';Object.assign(settings,settingDefaults())}overlay.remove();settingsOrigin=null;parentOrigin=null;go('settings');const message=removed.length===2?'記録と設定を 消去しました':removed.length===0?'削除できたか確認できません。画面の記録と設定は保持しています':removed.includes(STORE)?'記録は消去しました。設定は削除できたか確認できません':'設定は消去しました。学習記録は削除できたか確認できません';const note=document.createElement('p');note.className='settingsHelp';note.setAttribute('role','status');note.textContent=message;app.querySelector('.settingsScroll').prepend(note)};
}
function policyModal(kind){
 const privacy=kind==='privacy';const title=privacy?'プライバシーについて':'ご利用について';
 const text=privacy?`<p>学習記録・作品・任意のニックネーム・年齢帯は、ご利用中のブラウザの保存領域にのみ保管されます。アカウント登録はありません。</p><p>お子さまの氏名、住所、学校名、生年月日、顔写真、音声を入力する必要はありません。音声収録や外部AIへの送信は行いません。</p><p>記録は保護者向け設定から書き出し・削除できます。ブラウザのデータ削除や端末変更でも失われます。サーバーへのバックアップ・端末間同期はありません。</p><p>外部の画像配信に依存しないよう、AIPPOの公式キャラクター画像はサイト内から配信します。</p>`:`<p>AIPPO Kidsは、5歳頃から遊べるAI学習のおためし版です。AIの出力は事前に設計されたシミュレーションであり、実際の生成AIによる回答ではありません。</p><p>保護者と一緒に使用してください。クエストクリアは練習課題の達成を示すもので、IQや他のお子さまとの優劣を示すものではありません。</p><p>この版はお支払い・会員登録・クラウド同期に対応していません。サービスの内容は改善に伴って変更することがあります。</p>`;
 const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal policyModal" role="dialog" aria-modal="true" aria-labelledby="policy-title"><h2 id="policy-title">${title}</h2><div class="policyText">${text}</div><button class="primary" data-close="1">とじる</button></div>`;
 app.querySelector('.shell').append(overlay);overlay.querySelector('[data-close]').onclick=()=>overlay.remove();
}
function howTo(){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="how-title"><h2 id="how-title">AIと あそぼう！</h2><div class="helperRow"><span>${ico('hand')}えらぶ</span>${ico('arrow',16)}<span>${ico('bot')}AIに おねがい</span>${ico('arrow',16)}<span>${ico('inspect')}たしかめる</span></div><p>カードを タップするか、青い枠へドラッグしてね。<br>ちがう結果なら、もういちどためそう。</p><button class="primary" data-close="1">わかった！</button></div>`;app.querySelector('.shell').append(overlay);overlay.querySelector('[data-close]').onclick=()=>overlay.remove()}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=childText(message);document.body.append(el);setTimeout(()=>el.remove(),1400)}
function sprinkle(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const shell=app.querySelector('.shell');for(let i=0;i<15;i++){const d=document.createElement('i');d.className='confetti';d.style.left=(Math.random()*100)+'%';d.style.background=['#2682dd','#76d4b9','#ffd069'][i%3];d.style.setProperty('--dx',(Math.random()*200-100)+'px');d.style.setProperty('--rot',(Math.random()*700-350)+'deg');shell.append(d);setTimeout(()=>d.remove(),1500)}}
function inside(el,x,y,pad=22){const r=el.getBoundingClientRect();return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad}
function bindDrag(card,fn){let drag=null;card.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,moved:false};try{card.setPointerCapture(e.pointerId)}catch{}});card.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.moved=true;let ghost=document.querySelector('.dragGhost');if(!ghost){ghost=card.cloneNode(true);ghost.classList.add('dragGhost');ghost.classList.remove('choice','selected');ghost.setAttribute('aria-hidden','true');ghost.removeAttribute('data-select');ghost.removeAttribute('data-order-pick');document.body.append(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';app.querySelectorAll('[data-drop],[data-order-slot]').forEach(slot=>slot.classList.toggle('hover',inside(slot,e.clientX,e.clientY)))});card.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;document.querySelector('.dragGhost')?.remove();app.querySelectorAll('.hover').forEach(x=>x.classList.remove('hover'));if(moved){const ok=fn({x:e.clientX,y:e.clientY});if(!ok)toast('青い枠に いれてね')}});card.addEventListener('pointercancel',()=>{drag=null;document.querySelector('.dragGhost')?.remove()})}
function bindSelections(){
 app.querySelectorAll('[data-select]').forEach(b=>{
  const [kind,id]=b.dataset.select.split(':');
  const choose=()=>{
   state.selected[kind]=id;
   const q=quests[state.quest];
   finishPoSpeech();
   if(['color','place','shape','spot','exam'].includes(q.kind)){
    app.querySelectorAll('[data-select]').forEach(card=>{const selected=card.dataset.select===kind+':'+id;card.classList.toggle('selected',selected);card.setAttribute('aria-pressed',String(selected))});
    const target=app.querySelector('[data-drop="'+kind+'"]');if(target){target.classList.add('filled');target.innerHTML=iconArt(kind,id)+' '+escape(get(kind,id)?.label||id)}
    const submit=app.querySelector('[data-action="submit"]');if(submit){submit.disabled=false;submit.innerHTML='AIに おねがい！ '+ico('bot')}
    return;
   }
   if(q.kind==='combine'||q.kind==='create'){
    const seq=q.kind==='create'?['color','place','shape']:['color','place'];
    state.builderFocus=seq.find(k=>!state.selected[k])||kind;
   }
   render();
  };
  b.onclick=choose;
  bindDrag(b,({x,y})=>{
   const target=[...app.querySelectorAll('[data-drop]')].find(el=>el.dataset.drop===kind&&inside(el,x,y));
   if(!target)return false;
   choose();
   return true;
  });
 });
}
function simulate(callback){if(simulationTimer!==null){state.tries=Math.max(0,state.tries-1);return}const shell=app.querySelector('.shell');const mask=document.createElement('div');mask.className='think';mask.innerHTML=`<span class="thinkIcon">${ico('bot',46)}</span><strong>AIが つくっているよ…</strong>`;cancelSimulation();shell.append(mask);const quest=state.quest;simulationAttempt={quest,tries:state.tries};simulationTimer=setTimeout(()=>{simulationTimer=null;simulationAttempt=null;if(state.view==='play'&&state.quest===quest)callback()},450)}
function render(){if(state.view==='home')home();else if(state.view==='map')map();else if(state.view==='entrance')questEntrance();else if(state.view==='play')play();else if(state.view==='result')resultView();else if(state.view==='win')win();else if(state.view==='parent')parent();else if(state.view==='settings')settingsView();setupPoSpeech();}
window.AIPPO_TEST={state,saved,quests,worlds,allQuests,legacyQuests,worldIndices,questIndex,go,startQuest,enterQuest,leaveQuest,count,mastery,unlocked,stagePassed,stampOwned,stageRequirement,questPassed,nextFinish,render,practicalTests};
if(settings.guardianAccepted&&count()>0&&recommendedChallenge()==='guided'){state.view='map';state.world=currentWorld()}
saved.schema=4;save();
render();
})();
</script>
