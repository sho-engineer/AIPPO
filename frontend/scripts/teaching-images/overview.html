<meta charset="utf-8">
<title>全体図</title>
<link rel="stylesheet" href="/fonts.css">
<style>
  /*
    全体図（Lesson Overview）の版下。

    中身は overviews.json から読む。文言・時間を変えるときは
    **あちらを直してここを作り直す**——絵の中の文字は焼き込みなので、
    データだけ直すと静かにずれる（Day1 で起きた）。

    色と書体はアプリと同じものを使う。`fonts.css` は public/ から、
    ポーは public/assets/po/ から。**ポーは描き直さない。**
    公式の8枚のどれかを、見えている絵の背丈を指定して置く。
  */
  :root {
    --brand: #1268E8;
    --brand-dark: #0B5FD0;
    --brand-line: #C9DEFB;
    --ink: #0A1E3A;
    --ink-muted: #47657E;
    --line: #E6EDF6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #333;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    padding: 20px;
  }

  /* 1:1。Day をまたいでも、開いた一枚の高さが跳ねないようにする */
  #board {
    position: relative;
    width: 616px; height: 616px;
    padding: 30px;
    background:
      radial-gradient(80% 50% at 88% 6%, rgba(43,176,238,.10) 0%, rgba(43,176,238,0) 70%),
      #FFFFFF;
    color: var(--ink);
    overflow: hidden;
  }

  .day {
    display: inline-flex; align-items: center; justify-content: center;
    height: 38px; padding: 0 20px; border-radius: 999px;
    background: var(--brand); color: #fff;
    font-size: 21px; font-weight: 700; letter-spacing: .04em;
  }
  h1 { margin-top: 14px; font-size: 52px; font-weight: 700; line-height: 1.19; }
  .sub { margin-top: 10px; font-size: 20px; font-weight: 700; color: var(--brand-dark); }

  .compare { position: absolute; left: 30px; right: 30px; top: 264px; height: 178px; }
  .card {
    position: absolute; top: 0; width: 198px; height: 178px;
    border-radius: 16px; padding: 12px;
    background: #fff; border: 1.5px solid var(--line);
  }
  .card.after { border-color: var(--brand-line); background: #FBFDFF; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .tag {
    display: inline-flex; align-items: center; justify-content: center;
    height: 26px; padding: 0 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .tag.before { background: #7A8798; }
  .tag.after  { background: var(--brand); }
  .badge {
    width: 28px; height: 28px; flex: none; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; font-weight: 700;
  }
  .lines { position: relative; margin-top: 10px; height: 62px; }
  /* 何がむずかしいのかを、絵だけで分かるようにする札 */
  .chips { position: absolute; right: 0; top: -2px; display: grid; gap: 3px; justify-items: end; }
  .chips span {
    display: inline-block; padding: 2px 7px; border-radius: 7px;
    background: #EEF1F5; color: #5B6B7E; font-size: 9.5px; font-weight: 700;
  }
  .cap { margin-top: 8px; font-size: 11.5px; line-height: 1.55; font-weight: 700; }
  .cap.before { color: var(--ink-muted); }
  .cap.after  { color: var(--brand-dark); }

  .panel {
    position: absolute; left: 30px; right: 30px; top: 460px; height: 126px;
    border-radius: 18px; background: #EEF5FE;
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
  }
  .panel .mark {
    width: 44px; height: 44px; flex: none; border-radius: 22px;
    background: var(--brand); display: flex; align-items: center; justify-content: center;
  }
  .panel .body { flex: 1; min-width: 0; }
  .panel h2 { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
  .panel ul { margin-top: 6px; list-style: none; }
  .panel li {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 700; line-height: 1.9;
  }
  .time {
    flex: none; width: 132px; border-radius: 14px; background: #DEEAFB;
    padding: 8px 0; text-align: center;
  }
  .time .label {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--brand-dark);
  }
  .time .value { margin-top: 1px; font-size: 15px; font-weight: 700; color: var(--brand-dark); }
  .time .value b { font-size: 30px; }

  .po { position: absolute; }
  .po img { width: 100%; height: 100%; display: block; }
  .deco { position: absolute; }
</style>

<div id="board"></div>

<script type="module">
/*
  512×512 の台紙に対して、絵が実際に写っている範囲。
  src/po/assets.ts の PO_BOX と同じ値。**絵を差し替えたら両方直す。**
*/
const PO_BOX = {
  neutral:   { cx: 49.8, cy: 61.2, height: 72.1 },
  question:  { cx: 49.9, cy: 57.7, height: 78.7 },
  thinking:  { cx: 50.1, cy: 61.0, height: 72.1 },
  talking:   { cx: 47.2, cy: 54.0, height: 57.6 },
  hint:      { cx: 50.8, cy: 60.2, height: 74.6 },
  warning:   { cx: 56.2, cy: 61.0, height: 72.5 },
  celebrate: { cx: 50.8, cy: 61.1, height: 71.9 },
  blink:     { cx: 50.0, cy: 56.0, height: 61.5 },
};

/** ポーを「見えている絵」の基準で置く。cx,cy = 絵の中心、h = 背丈。 */
function po(name, cx, cy, h) {
  const box = PO_BOX[name];
  const canvas = h / (box.height / 100);
  return `<div class="po" style="left:${cx - canvas * (box.cx / 100)}px;
    top:${cy - canvas * (box.cy / 100)}px;width:${canvas}px;height:${canvas}px">
    <img src="/assets/po/${name}.webp" alt=""></div>`;
}

const check = `<svg width="15" height="15" viewBox="0 0 24 24" fill="#1268E8">
  <circle cx="12" cy="12" r="11"/>
  <path d="M6.5 12.4l3.6 3.6L17.6 8" stroke="#fff" stroke-width="2.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function lines(fill, widths) {
  return `<svg width="174" height="62" viewBox="0 0 174 62" fill="${fill}">
    ${widths.map((w, i) => `<rect x="0" y="${4 + i * 17}" width="${w}" height="7" rx="3.5"/>`).join("")}
  </svg>`;
}

const day = new URLSearchParams(location.search).get("day") ?? "day1_overview";
const all = await (await fetch("/overviews.json")).json();
const it = all.images[day];
if (!it) throw new Error(`${day} が overviews.json に無い`);

document.getElementById("board").innerHTML = `
  <span class="day">Day ${day.replace(/[^0-9]/g, "")}</span>
  <h1>${it.titleLines.join("<br>")}</h1>
  <p class="sub">${it.sub}</p>

  <svg class="deco" style="left:520px;top:36px" width="70" height="70" viewBox="0 0 70 70" fill="#CFE4FA">
    <path d="M46 8c.6 9.4 4.4 13.2 13.8 13.8C50.4 22.4 46.6 26.2 46 35.6 45.4 26.2 41.6 22.4 32.2 21.8 41.6 21.2 45.4 17.4 46 8z"/>
    <path d="M22 30c.4 6 2.8 8.4 8.8 8.8C24.8 39.2 22.4 41.6 22 47.6 21.6 41.6 19.2 39.2 13.2 38.8 19.2 38.4 21.6 36 22 30z" opacity=".7"/>
  </svg>

  <div class="compare">
    <div class="card before" style="left:126px">
      <div class="head">
        <span class="tag before">${it.before.tag}</span>
        <div class="badge" style="background:#7A8798">?</div>
      </div>
      <div class="lines">
        ${lines("#D8DFE8", [140, 166, 120])}
        ${it.before.chips?.length
          ? `<div class="chips">${it.before.chips.map((c) => `<span>${c}</span>`).join("")}</div>`
          : ""}
      </div>
      <p class="cap before">${it.before.caption}</p>
    </div>

    <svg class="deco" style="left:324px;top:76px" width="38" height="30" viewBox="0 0 38 30" fill="none">
      <path d="M2 15h22" stroke="#4FA9EC" stroke-width="6" stroke-linecap="round"/>
      <path d="M20 4l16 11-16 11z" fill="#4FA9EC"/>
    </svg>

    <div class="card after" style="left:358px">
      <div class="head">
        <span class="tag after">${it.after.tag}</span>
        <div class="badge" style="background:var(--brand)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l5 5 9-11" stroke="#fff" stroke-width="3.4"
                  stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="lines">${lines("#BEDCFA", [150, 132, 166])}</div>
      <p class="cap after">${it.after.caption}</p>
    </div>
  </div>

  <div class="panel">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">
        <path d="M12 3.5c5.2 0 9.5 3.2 9.5 7.2s-4.3 7.2-9.5 7.2c-1 0-2-.1-2.9-.3l-5.1 2.4 1.4-4c-1.5-1.3-2.4-3.1-2.4-5.3 0-4 4.3-7.2 9-7.2z"/>
        <g fill="#1268E8"><circle cx="8.4" cy="10.7" r="1.3"/><circle cx="12" cy="10.7" r="1.3"/><circle cx="15.6" cy="10.7" r="1.3"/></g>
      </svg>
    </div>
    <div class="body">
      <h2>こんなことができるようになる！</h2>
      <ul>${it.outcomes.map((o) => `<li>${check}${o}</li>`).join("")}</ul>
    </div>
    <div class="time">
      <div class="label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B5FD0" stroke-width="2.4">
          <circle cx="12" cy="12" r="9.5"/><path d="M12 6.6V12l4 2.4" stroke-linecap="round"/>
        </svg>
        学習時間の目安
      </div>
      <div class="value">約 <b>${it.minutes}</b> 分</div>
    </div>
  </div>

  ${po("talking", 88, 356, 152)}
`;

/*
  書体が来てから印を立てる。焼き出す側はこの印を待つ
  （render.mjs）。印を DOM に置くのは、Node 側の道具から
  `window` を触らずに済ませるため。
*/
await document.fonts.ready;
await new Promise((r) => setTimeout(r, 300));
document.getElementById("board").dataset.ready = "1";
</script>
