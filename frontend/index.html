<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      画面の持ち方を、ここで決める。

      viewport-fit=cover
        これが無いと、iPhone では `env(safe-area-inset-*)` が**ぜんぶ 0**
        になる。アプリの中では帯やボタンが安全領域を避けるように書いて
        あるが、宣言が無いので実機では一度も効いていなかった
        （切り欠きとホームバーの上に、そのまま重なる）。

      interactive-widget=resizes-content
        ソフトキーボードが出たとき、画面の高さ（`100dvh`）を縮める。
        既定（`resizes-visual`）では高さが変わらないので、柱の
        いちばん下に置いた「次へ」がキーボードの裏へ入る——入力欄と
        ボタンが同時に見えることは、この画面でいちばん大事な条件
        （要件 §6.11）。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="AIをさわってみたい人のための、手を動かして学ぶ練習アプリです。"
    />
    <title>AIPPO（アイッポ） — 文章を分かりやすくする</title>

    <!--
      共有されたときの見え方。
      これが無いと、URL だけが貼られて何のアプリか分からない状態で回る。
      画像は scripts/build-poe.py が作るポーから組み立てている。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIPPO" />
    <meta property="og:title" content="AIPPO（アイッポ） — AIの最初の一歩を、ハンズオンで。" />
    <meta
      property="og:description"
      content="AIが気になる。でも、何をすればいいか分からない人へ。実際にAIを触りながら、自分に合った使い道を見つけられます。"
    />
    <meta property="og:image" content="/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F2FAFE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
