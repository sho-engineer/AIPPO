.parentView{background:linear-gradient(180deg,#ffffff,#f5faff 95%)}.parentTop{padding:17px 18px 9px;display:flex;align-items:flex-start;gap:10px}.parentTitles{flex:1;min-width:0}.parentTop .h1{font-size:clamp(19px,5.3vw,30px);line-height:1.3;overflow-wrap:anywhere}.parentIntro{padding:0 20px 10px;color:#607a94;font-weight:750;font-size:12px;line-height:1.55}.pyramidWrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:2px 16px 8px}.tier{border:0;width:var(--w);min-height:53px;max-height:75px;background:linear-gradient(110deg,#dde9f5,#ebf1f8);color:#637992;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;border-radius:9px;position:relative;transition:transform .14s,box-shadow .14s;padding:5px 8px;text-align:center}.tier:active{transform:scale(.98)}.tier.mastered{background:linear-gradient(100deg,#1268e8,#2bb0ee);color:#fff;box-shadow:0 3px 0 #a3cde9}.tier.current{background:linear-gradient(100deg,#69cbbb,#b9eade);color:#0f5d62;box-shadow:0 3px 0 #c8ecdf}.tier.selected{outline:3px solid #ffc654;outline-offset:1px;z-index:2}.tierNo{font-size:9px;font-weight:1000;letter-spacing:.1em;opacity:.87}.tierTitle{font-size:clamp(10px,2.85vw,15px);font-weight:1000;line-height:1.2;white-space:normal;overflow-wrap:anywhere}.tierNote{position:absolute;right:8px;top:8px;font-size:11px;font-weight:900}.evidence{flex:none;padding:12px 16px;margin:0 13px 11px;background:#fff;border:1.5px solid #d7e7f8;border-radius:16px;box-shadow:0 3px 16px #1049970e;display:flex;flex-direction:column;gap:5px;min-height:92px}.evidenceTitle{font-weight:1000;font-size:14px}.evidenceBody{font-size:12px;line-height:1.5;color:#50708e;font-weight:750}.evidenceStatus{font-size:11px;font-weight:950;color:#1e7b66}.parentBottom{display:flex;gap:7px;padding:0 13px 14px}.parentBottom button{flex:1;font-size:12px;min-height:45px}
/* overlays and microinteraction */

<body>
<div class="app" id="app" aria-live="off"></div>
<script>(()=>{
'use strict';
const app=document.getElementById('app');
const PO='assets/po/';
const BRAND='brand/logo-horizontal.webp';
const STORE='aippo_kids_journey_v1';
const SETTINGS_STORE='aippo_kids_settings_v1';
const auth={status:'loading',user:null,mode:'signin',step:'password',busy:false,error:'',success:'',email:'',password:'',code:'',returnTo:'map'};
const accountHash=email=>{let n=2166136261;for(const c of String(email).trim().toLowerCase()){n=Math.imul(n^c.charCodeAt(0),16777619)}return (n>>>0).toString(16)};
const progressStore=()=>auth.user?STORE+':account:'+accountHash(auth.user.email):STORE;
function loadSettings(){try{const s=JSON.parse(localStorage.getItem(SETTINGS_STORE)||'null');if(s&&typeof s==='object')return {guardianAccepted:s.guardianAccepted===true, nickname:typeof s.nickname==='string'?s.nickname.slice(0,12):'', ageBand:['unset','5-6','7-9','10-12'].includes(s.ageBand)?s.ageBand:'unset'}}catch{}return {guardianAccepted:false,nickname:'',ageBand:'unset'}}
const settings=loadSettings();
function saveSettings(){try{localStorage.setItem(SETTINGS_STORE,JSON.stringify(settings))}catch{}}

const colors=[{id:'blue',label:'あお',hex:'#4baded'},{id:'pink',label:'ピンク',hex:'#ee88b3'},{id:'yellow',label:'きいろ',hex:'#f8cc55'}];
const places=[{id:'moon',label:'おつきさま'},{id:'sea',label:'うみ'},{id:'forest',label:'もり'}];
const shapes=[{id:'round',label:'まる'},{id:'square',label:'しかく'},{id:'star',label:'ほし'}];
const orderCards=[{id:'choose',label:'えらぶ',icon:'hand'},{id:'ask',label:'AIにつたえる',icon:'bot'},{id:'check',label:'たしかめる',icon:'inspect'}];
const quests=[
 {title:'いろを つたえよう',short:'いろを つたえる',icon:'palette',intro:'あおい ロケットに してね',kind:'color',goal:{color:'blue'},skill:'AIに いろを つたえられた',explain:'ほしい色を選んでAIに伝えました。'},
 {title:'ばしょを つたえよう',short:'ばしょを つたえる',icon:'pin',intro:'おつきさまへ とばそう',kind:'place',goal:{place:'moon'},skill:'AIに ばしょを つたえられた',explain:'AIに行き先を指定することができました。'},
 {title:'まちがいを みつけよう',short:'まちがいを みつける',icon:'inspect',intro:'AIの こたえを みくらべよう',kind:'spot',goal:{color:'blue',place:'moon'},skill:'AIの まちがいを なおせた',explain:'目的とAIの結果を比べ、違うところを見つけて修正しました。'},
 {title:'かたちを つたえよう',short:'かたちを つたえる',icon:'shapes',intro:'まるい まどを つけよう',kind:'shape',goal:{shape:'round'},skill:'かたちを つたえられた',explain:'特徴を具体的に指定して、結果を調整しました。'},
 {title:'ふたつ つたえよう',short:'じょうけんを あわせる',icon:'layers',intro:'あおい ロケットで おつきさまへ',kind:'combine',goal:{color:'blue',place:'moon'},skill:'ふたつの じょうけんを あわせられた',explain:'色と行き先を組み合わせて、AIへの指示を作りました。'},
 {title:'AIの じゅんばん',short:'AIの つかいかた',icon:'list',intro:'つくる じゅんばんに ならべよう',kind:'order',goal:{},skill:'AIを つかう じゅんばんが わかった',explain:'目的を決める→AIに伝える→結果を確認する、という流れを理解しました。'},
 {title:'じぶんの ロケット',short:'AIと つくる',icon:'sparkles',intro:'すきな ロケットを つくろう',kind:'create',goal:{},skill:'じぶんの イメージを AIで つくれた',explain:'色・場所・形を自分で選び、AIへの指示を組み立てました。'},
 {title:'ランクアップ テスト',short:'できるかな？',icon:'trophy',intro:'ちがう ところを みつけて なおそう',kind:'exam',goal:{color:'blue',place:'moon',shape:'round'},skill:'AIの こたえを みて じぶんで なおせた',explain:'複数の条件を確認し、誤りを見つけて正しい指示に直しました。'}
];

// AIPPO original adventure: four worlds, two lessons each.
const worlds=[
 {name:'おねがいの もり',short:'もり',world:'forest',theme:'color',chapter:'WORLD 1',story:'ポーの まちの ひかりが きえちゃった。まずは AIに おねがい！',line:'AIには、ほしいものを つたえるよ',ending:'もりに あかりが ともった！'},
 {name:'みくらべの うみ',short:'うみ',world:'ocean',theme:'check',chapter:'WORLD 2',story:'AIも ときどき まちがえるよ。いっしょに みつけよう！',line:'できたものを みて、たしかめよう',ending:'うみに ひかりが もどった！'},
 {name:'くふうの そら',short:'そら',world:'sky',theme:'idea',chapter:'WORLD 3',story:'ふたつの おねがいを あわせて、もっと じょうずに！',line:'じゅんばんと くふうで パワーアップ',ending:'そらに ひかりが ひろがった！'},
 {name:'ひらめきの ほし',short:'ほし',world:'space',theme:'create',chapter:'WORLD 4',story:'さいごは じぶんの アイデアで。AIと いっしょに つくろう！',line:'AIの こたえを じぶんで かんがえる',ending:'ポーの まちに ひかりが もどった！'}
];
const worldOfQuest=n=>Math.floor(n/2);
const currentWorld=()=>worldOfQuest(currentIndex());

const tiers=[
 {name:'AIで かだいを かいけつ',subtitle:'自分で確認し、間違いを修正する',req:8,range:[7]},
 {name:'AIと つくって くふう',subtitle:'順番を考え、自分の作品を作る',req:7,range:[5,6]},
 {name:'じょうけんを あわせる',subtitle:'形や複数の条件を指定する',req:5,range:[3,4]},
 {name:'AIの こたえを たしかめる',subtitle:'結果を見て、間違いを直す',req:3,range:[1,2]},
 {name:'AIに おねがいできる',subtitle:'ほしい色を伝える',req:1,range:[0]}
];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({done:{},attempts:{},artwork:null});
function load(){try{let s=JSON.parse(localStorage.getItem(progressStore())||'null');if(s&&typeof s==='object'&&s.done&&typeof s.done==='object')return {done:s.done,attempts:s.attempts||{},artwork:s.artwork||null}}catch{}return defaults()}
let saved=load();
const state={view:'home',world:0,quest:0,sub:'',selected:{},order:[],result:null,tries:0,parentTier:4,question:false,showHint:false};
const today=()=>new Date().toISOString().slice(0,10);
const count=()=>quests.reduce((a,_,i)=>a+Number(Boolean(saved.done[i])),0);
const unlocked=i=>i===0||Boolean(saved.done[i-1]);
const currentIndex=()=>{const i=quests.findIndex((_,n)=>!saved.done[n]);return i<0?7:i};
const mastery=()=>[1,3,5,7,8].filter(x=>count()>=x).length;
const get=(kind,id)=>({color:colors,place:places,shape:shapes})[kind]?.find(x=>x.id===id);
const iconPaths={
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="m15 18-6-6 6-6"/>',map:'<path d="M3 6 9 3l6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/>',
 home:'<path d="m3 10 9-7 9 7v11H3zM9 21v-8h6v8"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 2-2c0-.9-.6-1.5-1.2-1.9-.9-.6-.5-2.1.7-2.1H18c2 0 3-1.9 3-3.5A9 9 0 0 0 12 3Z"/><circle cx="7" cy="11" r="1" fill="currentColor"/><circle cx="11" cy="7" r="1" fill="currentColor"/><circle cx="16" cy="8" r="1" fill="currentColor"/>',
 pin:'<path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12Z"/><circle cx="12" cy="10" r="2.3"/>',inspect:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',bot:'<rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 4v3"/><circle cx="9" cy="13" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.1" fill="currentColor" stroke="none"/><path d="M9 17h6"/>',
 shapes:'<circle cx="8" cy="8" r="5"/><rect x="12" y="12" width="9" height="9" rx="1"/>',layers:'<path d="m12 2 9 6-9 6-9-6 9-6Zm-9 11 9 6 9-6"/>',list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6h1M3 12h1M3 18h1"/>',
 sparkles:'<path d="m12 2 1.8 7.2L21 11l-7.2 1.8L12 20l-1.8-7.2L3 11l7.2-1.8L12 2Zm7 14 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>',trophy:'<path d="M7 3h10v7a5 5 0 0 1-10 0V3Zm2 18h6m-3-6v6M7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4"/>',
 check:'<path d="m4 12 5 5L20 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',hand:'<path d="M8 11V5a2 2 0 0 1 4 0v5-3a2 2 0 0 1 4 0v4-2a2 2 0 0 1 4 0v5c0 4-3 7-7 7h-1c-3 0-5-2-7-6l-1-3a2 2 0 0 1 4-1Z"/>',
 moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.7 8.7 0 1 0 20 14.5Z"/>',sea:'<path d="M2 10c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3m-20 7c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/>',forest:'<path d="m12 2-8 10h4l-5 6h18l-5-6h4L12 2Zm0 16v4"/>',
 repeat:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.5 9a7 7 0 0 1 12.5-1l1 4M4 12l1 4a7 7 0 0 0 12.5-1"/>',star:'<path d="m12 2 2.8 6.9L22 12l-7.2 3-2.8 7-2.8-7L2 12l7.2-3.1Z"/>',
 settings:'<path d="M12 2l1.4 2.8 3.1.4.7 3.1 2.8 1.4-1.6 2.8 1.6 2.8-2.8 1.4-.7 3.1-3.1.4L12 22l-1.4-2.8-3.1-.4-.7-3.1L4 14.3l1.6-2.8L4 8.7l2.8-1.4.7-3.1 3.1-.4L12 2Z"/><circle cx="12" cy="12" r="3.2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',trash:'<path d="M4 7h16M10 4h4M6 7l1 14h10l1-14M10 11v6m4-6v6"/>',question:'<path d="M9.5 9a2.5 2.5 0 1 1 4.5 1.5L12 13v1"/><circle cx="12" cy="18" r="1"/>',parent:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>'
};
function ico(name,size=24){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.star}</svg>`}
function po(face='talking'){face=({neutral:'talking',hint:'talking',question:'talking',thinking:'talking',warning:'talking',blink:'talking'}[face]||face);return `<span class="po"><span class="poFallback" aria-hidden="true">Po</span><img loading="eager" src="${PO}${face}.webp" alt="AIPPOのポーちゃん" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"></span>`}
function rocketSVG(color='blue',shape='round'){const hex=get('color',color)?.hex||'#4baded';let windowMarkup=shape==='square'?'<rect x="51" y="67" width="38" height="38" rx="5" fill="#fff"/><rect x="57" y="73" width="26" height="26" rx="2" fill="#7aa8e2"/>':shape==='star'?'<path d="m70 62 8 12 15 2-11 10 3 15-15-7-15 7 3-15-11-10 15-2Z" fill="#fff"/><path d="m70 72 4 6 7 1-5 5 1 7-7-3-7 3 1-7-5-5 7-1Z" fill="#75b3eb"/>':'<circle cx="70" cy="86" r="23" fill="#fff"/><circle cx="70" cy="86" r="16" fill="#7aa8e2"/>';
return `<svg class="rocket flying" viewBox="0 0 140 186" role="img" aria-label="ロケットの絵" xmlns="http://www.w3.org/2000/svg"><path d="M63 150 47 177 70 164 92 177 78 150" fill="#ffbd46"/><path d="M61 149 56 169 70 158 84 169 79 149" fill="#ff795a"/><path d="M39 112 16 151 42 145 58 123" fill="#5354b8" stroke="#353990" stroke-width="3"/><path d="m101 112 23 39-25-6-17-22" fill="#5354b8" stroke="#353990" stroke-width="3"/><path d="M70 7Q32 40 35 100l6 47q29 11 58 0l6-47Q108 40 70 7Z" fill="${hex}" stroke="#f7fdff" stroke-width="5"/><path d="M70 7Q56 20 47 41q23 12 46 0Q84 20 70 7Z" fill="#fff"/>${windowMarkup}<path d="M49 127h42" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75"/></svg>`}
function scene({color='blue',place='moon',shape='round',label='',empty=false}={}){return `<div class="preview place-${escape(place)}"><div class="spaceStars"></div><div class="moon"></div>${label?`<span class="previewLabel">${escape(label)}</span>`:''}${empty?`<div class="botPreview">${ico('bot',55)}</div>`:rocketSVG(color,shape)}</div>`}
function iconArt(kind,x){if(kind==='color')return `<span class="colorChip" style="background:${get(kind,x)?.hex||'#ccc'}"></span>`;if(kind==='shape'){if(x==='round')return `<svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="15" fill="#8ad1f5" stroke="#3675b0" stroke-width="3"/></svg>`;if(x==='square')return `<svg viewBox="0 0 40 40" width="34" height="34"><rect x="6" y="6" width="28" height="28" rx="3" fill="#8ad1f5" stroke="#3675b0" stroke-width="3"/></svg>`;return ico('star',34)};return ico(x,34)}
function choice(kind,x,selected=false){return `<button type="button" class="choice ${selected?'selected':''} ${!selected&&x.id===((kind==='color')?'blue':kind==='place'?'moon':kind==='shape'?'round':'')?'':''}" data-select="${escape(kind)}:${escape(x.id)}" aria-label="${escape(x.label)}" aria-pressed="${selected}"><span class="choiceIcon">${iconArt(kind,x.id)}</span><span class="choiceLabel">${escape(x.label)}</span></button>`}
function group(kind){const list={color:colors,place:places,shape:shapes}[kind]||[];return `<div class="choices">${list.map(x=>choice(kind,x,state.selected[kind]===x.id)).join('')}</div>`}
function slot(kind,label){let x=state.selected[kind];return `<div class="target ${x?'filled':''}" data-drop="${kind}">${x?`${iconArt(kind,x)} ${escape(get(kind,x)?.label||x)}`:`${ico('hand')} ${escape(label)}`}</div>`}
function save(){try{localStorage.setItem(progressStore(),JSON.stringify(saved))}catch{}}
function layout(body,{parent=false}={}){
 const isCover=state.view==='home'||state.view==='auth';
 app.classList.toggle('titleMode',isCover);
 app.innerHTML=`${isCover?'':`<header class="top"><div class="brand"><span class="brandName">AIPPO</span><img class="brandLogo" src="${BRAND}" alt="AIPPO" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none';this.previousElementSibling.style.display='inline-flex'"/><span class="brandLabel">KIDS</span></div><div class="topRight"><button class="topBtn" data-nav="${parent?'map':'parent'}" title="${parent?'マップに戻る':'保護者向け成長記録'}" aria-label="${parent?'マップに戻る':'保護者向け成長記録'}">${ico(parent?'map':'parent')}<span class="topBtnLabel">${parent?'マップ':'保護者'}</span></button><button class="topBtn settingBtn" data-nav="settings" title="設定" aria-label="設定">${ico('settings')}</button></div></header>`}<div class="shell">${body}</div>${isCover?'':'<div class="foot">AIの結果はおためし用のシミュレーションです</div>'}`;
 app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
}

function go(view){state.view=view;state.showHint=false;if(view==='map')state.world=currentWorld();if(view==='parent')state.parentTier=5-Math.max(1,mastery());render()}
function launchAdventure(){if(!settings.guardianAccepted){showGuardianSetup();return}go('map')}
function selectGuest(){auth.status=auth.user?'authenticated':'guest';launchAdventure()}
const OPENING_SEEN='aippo_title_opening_v1';
let openingAttempted=false,openingLayer=null,openingCleanup=null;
function endOpening(){if(openingCleanup){openingCleanup();openingCleanup=null}if(openingLayer){openingLayer.remove();openingLayer=null}app.inert=false;app.querySelector('[data-opening-replay]')?.focus({preventScroll:true})}
function playOpening(){
 if(openingLayer||!app.querySelector('.posterTitle'))return;
 const layer=document.createElement('div');openingLayer=layer;layer.className='openingLayer';layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','4秒のオープニング');
 layer.innerHTML='<video muted playsinline autoplay preload="auto" aria-hidden="true"></video><button type="button" class="openingSkip" data-opening-skip>スキップ</button>';
 const video=layer.querySelector('video');video.muted=true;video.playsInline=true;video.src='media/aippo-opening-v1.mp4';
 let loadTimer=setTimeout(endOpening,1200),maximumTimer=setTimeout(endOpening,5500),stallTimer;
 const visibility=()=>{if(document.hidden)endOpening()};document.addEventListener('visibilitychange',visibility);
 const observer=new MutationObserver(()=>{if(!app.querySelector('.posterTitle'))endOpening()});observer.observe(app,{childList:true,subtree:true});
 openingCleanup=()=>{clearTimeout(loadTimer);clearTimeout(maximumTimer);clearTimeout(stallTimer);observer.disconnect();document.removeEventListener('visibilitychange',visibility);video.onplaying=null;video.onwaiting=null;video.onended=null;video.onerror=null;video.pause();video.removeAttribute('src');video.load()};
 video.onplaying=()=>{clearTimeout(loadTimer);clearTimeout(stallTimer)};
 video.onwaiting=()=>{clearTimeout(stallTimer);stallTimer=setTimeout(endOpening,1200)};
 video.onended=endOpening;video.onerror=endOpening;layer.querySelector('[data-opening-skip]').onclick=endOpening;
 layer.addEventListener('keydown',event=>{if(event.key==='Escape')endOpening();if(event.key==='Tab'){event.preventDefault();layer.querySelector('button').focus()}});
 document.body.append(layer);app.inert=true;layer.querySelector('button').focus();

function csrfCookie(){try{const m=document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);return m?decodeURIComponent(m[1]):''}catch{return ''}}
async function csrf(){if(csrfCookie())return csrfCookie();const r=await fetch(API+'/csrf/',{credentials:'same-origin'});if(!r.ok)throw Error('認証サービスに接続できません。');return csrfCookie()}
async function apiCall(path,payload=null){const headers={'Accept':'application/json'};if(payload!==null){const token=await csrf();if(token)headers['X-CSRFToken']=token;headers['Content-Type']='application/json'}const r=await fetch(API+path,{method:payload===null?'GET':'POST',headers,credentials:'same-origin',body:payload===null?undefined:JSON.stringify(payload)});let body={};try{body=await r.json()}catch{}if(!r.ok){const msgs=body?.errors&&typeof body.errors==='object'?Object.values(body.errors).flat().filter(x=>typeof x==='string'):[];const err=new Error(msgs[0]||body?.detail||body?.message||(r.status===403?'認証の確認に失敗しました。':'接続に失敗しました。もう一度お試しください。'));err.status=r.status;throw err}return body}

async function handleAuth(e){e.preventDefault();if(auth.busy)return;const form=e.currentTarget;const fd=new FormData(form);const email=String(fd.get('email')||auth.email||'').trim(),password=String(fd.get('password')||''),confirm=String(fd.get('confirm')||'');if(email)auth.email=email;auth.error='';auth.success='';if((auth.mode==='signup'||auth.mode==='confirm')&&password!==confirm){auth.error='パスワードが一致していません。';render();return}auth.busy=true;const submit=app.querySelector('.accountSubmit');if(submit){submit.disabled=true;submit.textContent='確認しています…'};
 try{
  if(auth.mode==='signin'){
   const r=await apiCall('/signin/',{email,password});
   if(r.mfa_required){auth.mode='mfa';auth.busy=false;render();return}
   const me=await apiCall('/me/');if(!me.authenticated||!me.user?.email)throw Error('ログイン状態を確認できませんでした。');auth.user=me.user;auth.status='authenticated';saved=load();go('home');return;
  }
  if(auth.mode==='mfa'){
   await apiCall('/mfa/verify/',{code:String(fd.get('mfa')||'')});const me=await apiCall('/me/');if(!me.authenticated||!me.user?.email)throw Error('ログイン状態を確認できませんでした。');auth.user=me.user;auth.status='authenticated';saved=load();go('home');return;
  }
  if(auth.mode==='signup'){
   if(fd.get('consent')!=='on')throw Error('保護者の同意を確認してください。');
   await apiCall('/signup/',{email,password,display_name:'',accept_terms:true,accept_privacy:true});const me=await apiCall('/me/');if(!me.authenticated||!me.user?.email)throw Error('登録後の状態を確認できませんでした。');auth.user=me.user;auth.status='authenticated';saved=load();go('home');return;
  }
  if(auth.mode==='reset'){await apiCall('/password/reset/',{email});auth.success='登録がある場合、再設定メールを送信しました。';auth.busy=false;render();return}
  if(auth.mode==='confirm'){await apiCall('/password/reset/confirm/',{uid:auth.uid,token:auth.token,new_password:password});auth.mode='signin';auth.success='パスワードを変更しました。ログインしてください。';auth.busy=false;render();return}
  if(auth.mode==='verify'){await apiCall('/email/verify/',{uid:auth.uid,token:auth.token});auth.mode='signin';auth.success='メールを確認しました。';auth.busy=false;render();return}
 }catch(err){auth.error=err.message||'通信に失敗しました。もう一度お試しください。'}finally{auth.busy=false;if(state.view==='auth')render()}
}

 };

function orderView(){const taken=new Set(state.order);const list=orderCards.filter(x=>!taken.has(x.id));layout(`<main class="view">${progressHead()}<div class="playBody" style="display:flex;flex-direction:column"><div class="orderBody"><div class="orderSlots">${[0,1,2].map((k)=>{let x=orderCards.find(i=>i.id===state.order[k]);return `<button type="button" class="target ${x?'filled':''}" data-order-slot="${k}" aria-label="${k+1}ばんめ ${x?x.label:'から'}"><span class="orderNum">${k+1}</span>${ico(x?x.icon:'hand')}${x?escape(x.label):'ここに おこう'}</button>`}).join('')}</div><div class="choices orderChoices">${list.map(x=>`<button type="button" class="choice" data-order-pick="${x.id}"><span class="choiceIcon">${ico(x.icon,35)}</span><span class="choiceLabel">${escape(x.label)}</span></button>`).join('')||'<p class="choiceNote">ぜんぶ ならべたね！</p>'}</div><div class="choiceNote">カードを じゅんばんに えらぼう</div></div></div>${actionButton(state.order.length===3?'じゅんばんを たしかめる':'カードを ならべよう',state.order.length!==3)}</main>`);app.querySelectorAll('[data-order-pick]').forEach(b=>{b.onclick=()=>{state.order.push(b.dataset.orderPick);render()};bindDrag(b,({x,y})=>{const rects=[...app.querySelectorAll('[data-order-slot]')];const idx=rects.findIndex(s=>inside(s,x,y,20));if(idx<0||idx>state.order.length)return false;state.order.splice(idx,0,b.dataset.orderPick);render();return true})});app.querySelectorAll('[data-order-slot]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.orderSlot);if(i<state.order.length){state.order.splice(i,1);render()}});app.querySelector('[data-action=submit]').onclick=()=>{if(state.order.length!==3)return;state.tries++;const success=state.order.join(',')==='choose,ask,check';state.result={success,from:'order',actual:[...state.order]};simulate(()=>{state.view='result';render()})}}
function play(){const q=quests[state.quest];if(q.kind==='spot'||q.kind==='exam'){if(!state.sub)return inspectView();return mainSimple()};if(q.kind==='combine'||q.kind==='create')return buildView();if(q.kind==='order')return orderView();return mainSimple()}
function resultView(){const q=quests[state.quest],r=state.result;if(!r)return go('map');const creator=q.kind==='create',order=q.kind==='order';const correct=Boolean(r.success);let content='';if(order){content=`<div class="resultCompare"> <div class="preview" style="background:#edf5ff;color:#1e64ac"><div style="z-index:1;text-align:center;font-weight:1000;font-size:13px;line-height:2.5;color:#164c81">${['えらぶ','AIにつたえる','たしかめる'].join('<br>')}</div></div><div class="preview" style="background:${correct?'#eafaf5':'#fff2ea'}"><div style="z-index:1;text-align:center;color:#174d80;font-weight:1000;font-size:13px;line-height:2.5">${r.actual.map(x=>escape(orderCards.find(z=>z.id===x)?.label||'')).join('<br>')}</div></div></div>`}
else{const goal=q.kind==='shape'?{shape:'round'}:q.kind==='create'?r.actual:q.kind==='place'?{place:'moon'}:q.kind==='combine'?{color:'blue',place:'moon'}:{color:'blue',place:'moon'};content=`<div class="resultCompare">${scene({...goal,label:creator?'じぶんの イメージ':'ポーの おねがい'})}${scene({...r.actual,label:'AIの こたえ'})}</div>`}

function win(){const q=quests[state.quest],final=state.quest===7;layout(`<main class="view"><div class="screenHead"><span class="eyebrow">QUEST ${state.quest+1} CLEAR</span><button class="back" data-nav="map" aria-label="マップに戻る">${ico('close')}</button></div><section class="success"><div class="successBadge">${ico(final?'trophy':'star',42)}</div><h1>${final?'ランクアップ！':'AIの コツ GET！'}</h1><p>${escape(q.skill)}</p><div class="successVisual poCelebration"><div class="successHalo" aria-hidden="true"></div><div class="successPoHero">${po('celebrate')}</div><div class="successStar successStarOne" aria-hidden="true">${ico('sparkles',30)}</div><div class="successStar successStarTwo" aria-hidden="true">${ico('star',23)}</div></div><div class="unlockNote">${final?'LEVEL 5 まで できた！':state.quest%2===1?worlds[worldOfQuest(state.quest)].ending:'ひかりを ひとつ みつけた！'}</div></section><div class="actionBar"><button class="primary" data-action="next">${final?'ピラミッドを みる':'つぎへ すすむ'} ${ico('arrow')}</button></div></main>`);sprinkle();app.querySelector('[data-action=next]').onclick=()=>final?go('parent'):go('map')}
function parent(){const complete=count(),level=mastery();const chosen=tiers[state.parentTier]||tiers[4];const achieved=complete>=chosen.req;const progressInTier=chosen.range.filter(i=>saved.done[i]);const selectedNumber=5-state.parentTier;const evidence=progressInTier.map(i=>`「${quests[i].short}」`).join('・');const txt=achieved?'この段階をクリアしています。'+evidence+'ができました。':evidence?`${evidence}はクリア済み。あと${chosen.range.length-progressInTier.length}クエストでこの段階を習得します。`:'この段階は、これから挑戦する目標です。';

function showRecord(){const lines=quests.map((q,i)=>{const v=saved.done[i];return `<div style="padding:9px 0;border-bottom:1px solid #e9f1f9;display:flex;justify-content:space-between;gap:8px;text-align:left;font-size:12px;font-weight:850"><span>${escape(q.short)}</span><span style="color:${v?'#1a8e78':'#7991a7'};white-space:nowrap">${v?'習得 '+escape(v.at||''):'未習得'}</span></div>`}).join('');const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="record-title"><h2 id="record-title">クリアしたこと</h2><p>この端末でクリアしたクエストの記録です。</p>${lines}<p style="font-size:11px;text-align:left">※ 学習課題のクリア記録であり、IQや他の子との優劣を測るものではありません。</p><button class="primary" data-close="1">とじる</button></div>`;app.querySelector('.shell').append(overlay);overlay.querySelector('[data-close]').onclick=()=>overlay.remove()}

rrow',18)}</button><p class="settingsHelp">AIPPO Kids β版・AIの結果はシミュレーション。音声・外部AI送信・広告トラッキングなし。</p></section></div><div class="settingsFooter"><button class="secondary" data-action="settings-done">ゲームに戻る</button></div></main>`);

function policyModal(kind){

 const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal policyModal" role="dialog" aria-modal="true" aria-labelledby="policy-title"><h2 id="policy-title">${title}</h2><div class="policyText">${text}</div><button class="primary" data-close="1">とじる</button></div>`;

function howTo(){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="how-title"><h2 id="how-title">AIと あそぼう！</h2><div class="helperRow"><span>${ico('hand')}えらぶ</span>${ico('arrow',16)}<span>${ico('bot')}AIに おねがい</span>${ico('arrow',16)}<span>${ico('inspect')}たしかめる</span></div><p>カードを タップするか、青い枠へドラッグしてね。<br>ちがう結果なら、もういちどためそう。</p><button class="primary" data-close="1">わかった！</button></div>`;app.querySelector('.shell').append(overlay);overlay.querySelector('[data-close]').onclick=()=>overlay.remove()}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),1400)}
function sprinkle(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const shell=app.querySelector('.shell');for(let i=0;i<15;i++){const d=document.createElement('i');d.className='confetti';d.style.left=(Math.random()*100)+'%';d.style.background=['#2682dd','#76d4b9','#ffd069'][i%3];d.style.setProperty('--dx',(Math.random()*200-100)+'px');d.style.setProperty('--rot',(Math.random()*700-350)+'deg');shell.append(d);setTimeout(()=>d.remove(),1500)}}
function inside(el,x,y,pad=22){const r=el.getBoundingClientRect();return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad}
function bindDrag(card,fn){let drag=null;card.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,moved:false};try{card.setPointerCapture(e.pointerId)}catch{}});card.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.moved=true;let ghost=document.querySelector('.dragGhost');if(!ghost){ghost=card.cloneNode(true);ghost.classList.add('dragGhost');ghost.classList.remove('choice','selected');ghost.setAttribute('aria-hidden','true');ghost.removeAttribute('data-select');ghost.removeAttribute('data-order-pick');document.body.append(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';app.querySelectorAll('[data-drop],[data-order-slot]').forEach(slot=>slot.classList.toggle('hover',inside(slot,e.clientX,e.clientY)))});card.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;document.querySelector('.dragGhost')?.remove();app.querySelectorAll('.hover').forEach(x=>x.classList.remove('hover'));if(moved){const ok=fn({x:e.clientX,y:e.clientY});if(!ok)toast('青い枠に いれてね')}});card.addEventListener('pointercancel',()=>{drag=null;document.querySelector('.dragGhost')?.remove()})}
function bindSelections(){
 app.querySelectorAll('[data-select]').forEach(b=>{
  const [kind,id]=b.dataset.select.split(':');
  const choose=()=>{
   state.selected[kind]=id;
   const q=quests[state.quest];
   if(q.kind==='combine'||q.kind==='create'){
    const seq=q.kind==='create'?['color','place','shape']:['color','place'];
    state.builderFocus=seq.find(k=>!state.selected[k])||kind;
   }
   render();
  };
  b.onclick=choose;
  bindDrag(b,({x,y})=>{
   const target=[...app.querySelectorAll('[data-drop]')].find(el=>el.dataset.drop===kind&&inside(el,x,y));
   if(!target)return false;
   choose();
   return true;
  });
 });
}
function simulate(callback){const shell=app.querySelector('.shell');const mask=document.createElement('div');mask.className='think';mask.innerHTML=`<span class="thinkIcon">${ico('bot',46)}</span><strong>AIが つくっているよ…</strong>`;shell.append(mask);setTimeout(callback,450)}

window.AIPPO_TEST={state,saved,quests,worlds,go,startQuest,count,mastery};

state.view='home';
checkIncomingLink();
